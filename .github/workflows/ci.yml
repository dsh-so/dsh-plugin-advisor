name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests + install verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pnpm (used by verify script)
        run: npm install -g pnpm
      - name: Unit tests
        run: npm test
      - name: Post-publish verify (npm + GitHub installs)
        run: node scripts/verify-install.mjs